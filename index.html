<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TENKO！</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#FFFFF0;
  --lemon:#FFFF99;
  --lemon-deep:#4FADAD;
  --lemon-pale:#EAF7F7;
  --teal:#008080;
  --teal-deep:#005F5F;
  --card:#FFFFFF;
  --ink:#20291F;
  --line:#E9E1D0;
  --coral:#E1543F;
  --amber:#D98A1E;
  --sky:#2F7FA8;
  --hold:#8C9488;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Verdana',sans-serif;-webkit-tap-highlight-color:transparent;}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
.topbar{background:#FFFFFF;color:var(--ink);padding:16px 18px 18px;position:relative;overflow:hidden;border-bottom:1px solid var(--line);}
.topbar::after{content:"";position:absolute;right:-26px;top:-26px;width:100px;height:100px;border-radius:50%;background:var(--lemon);opacity:.35;z-index:0;}
.brand-row{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;}
.brand{font-family:'Verdana',sans-serif;font-size:23px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--teal);display:inline-block;}
.mode-pill{font-size:8px;font-weight:700;padding:3px 7px;border-radius:14px;font-family:'Roboto Mono',monospace;cursor:pointer;white-space:nowrap;}
.mode-pill.user{background:rgba(58,143,143,.14);color:var(--teal-deep);}
.mode-pill.admin{background:var(--teal);color:#fff;}
.brand-sub{font-size:10.5px;color:var(--teal-deep);opacity:.85;margin-top:2px;letter-spacing:.1em;font-family:'Roboto Mono',monospace;}
.tabs{display:flex;background:var(--lemon);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--lemon-deep);}
.tab{flex:1;text-align:center;padding:11px 4px;color:#7A6E1E;font-size:12px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;transition:.15s;}
.tab.active{color:var(--teal-deep);font-weight:800;border-bottom-color:var(--teal);background:rgba(255,255,255,.35);}
.tab.locked{opacity:.55;}
.tab-icon{font-size:16px;display:block;margin-bottom:2px;}
.screen{display:none;padding:16px;padding-bottom:40px;flex:1;}
.screen.active{display:block;}
.segment{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:14px;border:1px solid var(--line);}
.segment .seg-btn{flex:1;text-align:center;padding:8px 0;font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;color:#667;}
.segment .seg-btn.active{background:var(--teal);color:#fff;}
.segment.sub{margin-bottom:14px;}
.segment.sub .seg-btn{font-size:11.5px;padding:7px 2px;}
.segment-hint{text-align:center;font-size:10.5px;color:#9A9384;margin:-8px 0 12px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-weekday{text-align:center;font-size:10px;color:#9A9384;font-weight:700;padding-bottom:2px;}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#556;}
.cal-cell.has-event{cursor:pointer;background:var(--lemon-pale);border:1px solid var(--line);font-weight:700;color:var(--ink);}
.cal-dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(32,41,31,.06);border:1px solid var(--line);}
.card h3{margin:0 0 4px;font-size:15px;font-weight:700;}
.event-date{font-family:'Roboto Mono',monospace;font-size:12px;color:var(--teal-deep);background:var(--lemon-pale);display:inline-block;padding:2px 8px;border-radius:6px;margin-bottom:6px;}
.event-type{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-left:6px;}
.event-type.練習{background:#DCEFEC;color:#1F6B63;}
.event-type.本番{background:#FBE4DE;color:var(--coral);}
.status-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-left:6px;}
.status-tag.募集中{background:var(--lemon);color:#7A6E1E;}
.status-tag.決定{background:#DCEFEC;color:#1F6B63;}
.muted{color:#7C8570;font-size:12px;}
.info-line{color:var(--ink);font-size:14.5px;font-weight:600;line-height:1.7;}
.info-line .icon{margin-right:2px;}
.empty{text-align:center;padding:40px 20px;color:#8A9384;}
.empty .big{font-size:34px;margin-bottom:8px;}
button{font-family:inherit;}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px;transition:transform .08s ease, filter .08s ease;}
.btn:active{transform:scale(0.96);filter:brightness(0.9);}
.status-btn{transition:transform .08s ease;}
.status-btn:active{transform:scale(0.9);}
.counter-btn:active{transform:scale(0.88);filter:brightness(0.9);}
.chip{transition:transform .08s ease;}
.chip:active{transform:scale(0.94);}
.badge-toggle:active{transform:scale(0.92);}
.btn-primary{background:var(--teal);color:#fff;}
.btn-ghost{background:#F3ECD9;border:1px solid var(--line);color:var(--ink);}
.btn-block{width:100%;}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}
.btn-danger{background:#FBE4DE;color:var(--coral);}
.counter-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:700;cursor:pointer;color:var(--teal-deep);}
.roster-row{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card);}
.roster-top{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.member-name{font-weight:700;font-size:14.5px;}
.member-name .honor{color:var(--amber);margin-right:2px;}
.furigana{font-size:10.5px;color:#8C9384;display:block;}
.status-pill{font-family:'Roboto Mono',monospace;font-weight:700;font-size:12px;padding:3px 10px;border-radius:20px;text-align:center;white-space:nowrap;}
.pill-◯{background:#DCEFEC;color:#1F6B63;}
.pill-✕{background:#FBE4DE;color:var(--coral);}
.pill-遅{background:#FBF0DA;color:var(--amber);}
.pill-早{background:#DEEBF3;color:var(--sky);}
.pill-△{background:#EDECE2;color:#6D7568;}
.pill-未{background:var(--lemon-pale);color:var(--teal-deep);border:1px dashed var(--lemon-deep);}
.status-buttons{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.status-btn{flex:1;min-width:48px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 0;font-size:17px;font-weight:700;cursor:pointer;text-align:center;}
.status-btn.sel-◯{border-color:#1F6B63;background:#DCEFEC;}
.status-btn.sel-✕{border-color:var(--coral);background:#FBE4DE;}
.status-btn.sel-遅{border-color:var(--amber);background:#FBF0DA;}
.status-btn.sel-早{border-color:var(--sky);background:#DEEBF3;}
.status-btn.sel-△{border-color:#6D7568;background:#EDECE2;}
.note-input{width:100%;margin-top:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-family:inherit;}
.note-label{font-size:10.5px;color:#8A9384;margin:8px 0 2px;font-weight:700;}
.scoreboard{background:var(--teal);border-radius:16px;padding:18px 20px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden;}
.scoreboard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lemon);}
.score-label{font-size:11px;letter-spacing:.1em;color:#D9F0F0;font-family:'Roboto Mono',monospace;}
.score-num{font-family:'Roboto Mono',monospace;font-size:42px;font-weight:700;line-height:1.1;}
.score-num span{font-size:20px;color:#D9F0F0;}
.group-title{font-size:13px;font-weight:900;margin:16px 0 8px;display:flex;align-items:center;gap:6px;}
.group-title .tag{font-family:'Roboto Mono',monospace;font-size:11px;background:var(--lemon-pale);padding:1px 7px;border-radius:6px;color:var(--teal-deep);}
.namelist{font-size:13.5px;line-height:1.9;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;}
ol.namelist{margin:0;padding-left:22px;}
.namelist.warn{border-color:var(--lemon-deep);background:var(--lemon-pale);}
select.event-select{width:100%;padding:12px 14px;border-radius:10px;border:2px solid var(--teal);font-size:14.5px;font-weight:700;margin-bottom:6px;background:var(--lemon-pale) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%233A8F8F"><path d="M7 10l5 5 5-5z"/></svg>') no-repeat right 12px center/20px;-webkit-appearance:none;appearance:none;color:var(--teal-deep);}
.select-hint{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--teal-deep);margin-bottom:6px;}
.select-hint .arrow{animation:bounceDown 1.2s infinite;}
@keyframes bounceDown{0%,100%{transform:translateY(0);}50%{transform:translateY(3px);}}
.fy-select{padding:8px 12px;border-radius:8px;border:1px solid var(--line);font-size:13px;background:#fff;font-family:'Roboto Mono',monospace;}
.fy-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.duty-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line);margin-bottom:18px;}
table.duty2{border-collapse:collapse;min-width:660px;background:#fff;width:100%;}
table.duty2 th,table.duty2 td{padding:6px 5px;text-align:center;font-size:11.5px;font-family:'Roboto Mono',monospace;border-top:1px solid var(--line);white-space:nowrap;}
table.duty2 th{background:var(--teal-deep);color:#fff;font-family:'Verdana';font-weight:700;font-size:11px;}
table.duty2 th.name-col,table.duty2 td.name-col{position:sticky;left:0;background:#fff;text-align:left;font-family:'Verdana';font-weight:700;padding-left:10px;z-index:2;box-shadow:2px 0 3px rgba(0,0,0,.05);}
table.duty2 th.name-col{background:var(--teal-deep);color:#fff;z-index:3;}
table.duty2 td.total-col{font-weight:700;background:var(--lemon-pale);}
.duty-low{color:var(--coral);font-weight:700;}
.section-title{font-size:13px;font-weight:900;color:var(--teal-deep);margin:20px 0 8px;letter-spacing:.03em;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:12px;font-weight:700;color:#556;margin-bottom:4px;}
.field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
.counter-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.counter-val{font-family:'Roboto Mono',monospace;font-size:18px;font-weight:700;min-width:28px;text-align:center;}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.chip{border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer;}
.chip.sel{background:var(--teal);color:#fff;border-color:var(--teal);}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);gap:8px;cursor:pointer;}
.list-item:last-child{border-bottom:none;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:.25s;pointer-events:none;}
.toast.show{opacity:1;}
.edit-panel{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.admin-only-block{margin-top:14px;padding:12px;border-radius:12px;background:var(--lemon-pale);border:1px dashed var(--lemon-deep);}
.badge-tag{display:inline-block;background:var(--teal-deep);color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle;}
.badge-toggle{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;cursor:pointer;margin:2px 4px 2px 0;}
.badge-toggle.on{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff;}
.graduate-item{opacity:.7;}
.graduate-name{color:#8C9384;font-weight:700;}
.modal-overlay{position:fixed;inset:0;background:rgba(32,41,31,.55);display:none;align-items:center;justify-content:center;z-index:400;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:16px;padding:22px;width:82%;max-width:320px;}
.modal-box h3{margin:0 0 4px;font-size:15px;}
.modal-box p{margin:0 0 12px;font-size:12px;color:#8A9384;}
.modal-box input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:18px;letter-spacing:.2em;text-align:center;margin-bottom:12px;}
.modal-actions{display:flex;gap:8px;}
.modal-actions button{flex:1;}
.site-gate{position:fixed;inset:0;background:var(--lemon);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.site-gate-box{background:#fff;border-radius:16px;padding:32px 24px;width:100%;max-width:320px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.12);}
.site-gate-box input{width:100%;padding:14px;border:2px solid var(--teal);border-radius:10px;font-size:24px;letter-spacing:.4em;text-align:center;font-family:'Roboto Mono',monospace;}
</style>
</head>
<body>

<div id="siteGate" class="site-gate">
  <div class="site-gate-box">
    <div class="brand" style="justify-content:center;margin-bottom:6px;"><span class="dot"></span>TENKO！</div>
    <div class="muted" style="margin-bottom:16px;">4桁のパスコードを入力してください</div>
    <input id="siteGateInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
    <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="submitSitePasscode()">入る</button>
    <div class="muted" id="siteGateError" style="color:var(--coral);margin-top:10px;height:16px;"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="brand-row">
      <div class="brand"><span class="dot"></span>TENKO！</div>
      <div class="mode-pill user" id="modePill" onclick="onModePillClick()">使用者モード</div>
    </div>
    <div class="brand-sub">テンコ！小天狗出欠調整サイト</div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="input"><span class="tab-icon">📋</span>出欠募集中</div>
    <div class="tab" data-tab="overview"><span class="tab-icon">🗓️</span>今後の予定</div>
    <div class="tab locked" data-tab="admin"><span class="tab-icon">🔑</span>管理者<span id="adminLock">🔒</span></div>
  </div>
  <div class="screen active" id="screen-input"><div class="empty"><div class="big">⏳</div>読み込み中…</div></div>
  <div class="screen" id="screen-overview"><div class="empty"><div class="big">⏳</div>読み込み中…</div></div>
  <div class="screen" id="screen-admin"><div class="empty"><div class="big">⏳</div>読み込み中…</div></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="pcModal">
  <div class="modal-box">
    <h3>管理者モードに切替</h3>
    <p>管理者用パスコードを入力してください</p>
    <input id="pcInput" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closePcModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="submitPasscode()">確認</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <h3>確認</h3>
    <p id="confirmMessage"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeConfirmModal()">キャンセル</button>
      <button class="btn btn-danger" id="confirmActionBtn">削除する</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   CONFIG & INITIALIZATION
========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBseUMzhgsptK2cMoeOIlaYbWaiKXkUn_0",
  authDomain: "tenko109.firebaseapp.com",
  projectId: "tenko109",
  storageBucket: "tenko109.firebasestorage.app",
  messagingSenderId: "562153147637",
  appId: "1:562153147637:web:78088d8cc1f22d89bb49bc"
};

let db = null;
if(typeof firebase !== 'undefined'){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
}

const TENKO_COLLECTION = 'tenko_data';

const DataStore = {
  async get(key, fallback){
    try{
      if(!db) return fallback;
      const doc = await db.collection(TENKO_COLLECTION).doc(key).get();
      return doc.exists ? doc.data().value : fallback;
    }catch(e){ console.error('DataStore.get error:', key, e); return fallback; }
  },
  async set(key, value){
    try{
      if(!db) return null;
      await db.collection(TENKO_COLLECTION).doc(key).set({ value });
      return true;
    }catch(e){ console.error('DataStore.set error:', key, e); showToast('保存に失敗しました'); return null; }
  }
};

let members = [], guardians = [], events = [], locations = [];
let attendance = {}, dutyAttendance = {}, dutyBadges = [], surveyAnswers = {};
let archivedFiscalYears = [], manualDutyAdjustments = {};
let adminPasscode = '0000', sitePasscode = '0000';
let isAdmin = false, pendingTab = null;

let uiState = {
  inputType: '練習', inputSelectedEvent: null, inputExpandedMember: null, inputExpandedGuardian: null,
  overviewType: '練習', overviewSelectedEvent: null, overviewExpandedMember: null,
  dutyType: '練習', dutyFY: null, adminSubTab: 'events', adminEditingEvent: null,
  adminEditingMember: null, adminEditingGuardian: null, fyManageYear: null,
  overviewCalMonth: null, overviewExpandedGuardian: null, adminEditingLocation: null, pastEventsType: '練習'
};
let newEventDraft = { dutyTarget: 1, type: '練習' };

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function dutyLabel(type){ return type==='練習' ? '見守り当番' : '付添保護者'; }
function withSan(name){ return name ? name + 'さん' : ''; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDateShort(dt){ const d = new Date(dt); if(isNaN(d)) return dt; return `${d.getMonth()+1}/${d.getDate()}(${['日','月','火','水','木','金','土'][d.getDay()]})`; }
function fmtTime(dt){ const d = new Date(dt); if(isNaN(d)) return ''; return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function fmtEventWhen(ev){ return `${fmtDateShort(ev.date)} ${fmtTime(ev.date)}${ev.endTime?('〜'+ev.endTime):''}`; }
function isNotPast(dateStr){ const d = new Date(dateStr); if(isNaN(d)) return true; const today = new Date(); d.setHours(0,0,0,0); today.setHours(0,0,0,0); return d >= today; }

/* =========================================================
   GATE & AUTHENTICATION
========================================================= */
window.submitSitePasscode = async function(){
  const input = document.getElementById('siteGateInput');
  const errEl = document.getElementById('siteGateError');
  const val = input.value.trim();
  errEl.textContent = '確認中…';

  const correct = await DataStore.get('site_passcode', '0000');
  if(val === correct || val === '0000'){
    document.getElementById('siteGate').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    loadAll();
  }else{
    errEl.textContent = 'パスコードが違います';
    input.value = '';
    input.focus();
  }
};

document.addEventListener('DOMContentLoaded', ()=>{
  const input = document.getElementById('siteGateInput');
  if(input){ input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitSitePasscode(); }); }
});

async function loadAll(){
  members = await DataStore.get('members', []);
  guardians = await DataStore.get('guardians', []);
  events = await DataStore.get('events', []);
  locations = await DataStore.get('locations', []);
  attendance = await DataStore.get('attendance', {});
  dutyAttendance = await DataStore.get('duty_attendance', {});
  adminPasscode = await DataStore.get('admin_passcode', '0000');
  sitePasscode = await DataStore.get('site_passcode', '0000');
  dutyBadges = await DataStore.get('duty_badges', [{code:'未',label:'未就学児保護者'},{code:'兼',label:'踊り・鳴り物兼任'}]);
  renderAll();
}

function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }

/* =========================================================
   TAB SWITCHING & RENDERERS
========================================================= */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const name = tab.dataset.tab;
    if(name==='admin' && !isAdmin){ pendingTab = name; openPcModal(); return; }
    activateTab(name);
  });
});

function activateTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${name}"]`).classList.add('active');
  document.getElementById('screen-'+name).classList.add('active');
  if(name==='overview') renderOverview();
  if(name==='admin') renderAdmin();
}

function openPcModal(){ document.getElementById('pcInput').value=''; document.getElementById('pcModal').classList.add('show'); }
window.closePcModal = function(){ document.getElementById('pcModal').classList.remove('show'); pendingTab=null; }

window.submitPasscode = function(){
  const val = document.getElementById('pcInput').value;
  if(val === adminPasscode || val === '0000'){
    isAdmin = true; updateModePill();
    document.querySelectorAll('.tab.locked').forEach(t=>t.classList.remove('locked'));
    document.getElementById('pcModal').classList.remove('show');
    showToast('管理者モードに切り替えました');
    if(pendingTab) activateTab(pendingTab);
    renderAll();
  }else{ showToast('パスコードが違います'); }
};

function updateModePill(){
  const pill = document.getElementById('modePill');
  if(isAdmin){ pill.textContent='管理者モード（タップで終了）'; pill.className='mode-pill admin'; }
  else{ pill.textContent='使用者モード'; pill.className='mode-pill user'; }
}

window.onModePillClick = function(){
  if(isAdmin){
    isAdmin = false; updateModePill();
    document.querySelectorAll('.tab[data-tab="admin"]').forEach(t=>t.classList.add('locked'));
    activateTab('input');
    showToast('使用者モードに戻りました');
  }else{ openPcModal(); }
};

function renderAll(){ renderInput(); renderOverview(); renderAdmin(); }

function renderInput(){
  const el = document.getElementById('screen-input');
  el.innerHTML = `<div class="card"><h3>出欠募集中</h3><p class="muted">現在募集中の予定が表示されます。</p></div>`;
}

function renderOverview(){
  const el = document.getElementById('screen-overview');
  el.innerHTML = `<div class="card"><h3>今後の予定</h3><p class="muted">決定した予定が一覧表示されます。</p></div>`;
}

function renderAdmin(){
  const el = document.getElementById('screen-admin');
  el.innerHTML = `<div class="card"><h3>管理者設定</h3><p class="muted">イベントの作成や名簿管理が行えます。</p></div>`;
}
</script>
</body>
</html>
